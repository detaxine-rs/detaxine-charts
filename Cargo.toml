[workspace]
resolver = "2"
members = ["src/core"]

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false }
web-sys = { version = "0.3.103", features = [
    "HtmlSelectElement",
    "HtmlDocument",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "DomRect",
    "Element",
] }
wasm-bindgen-test = "0.3.76"

[profile.release]
strip = true
